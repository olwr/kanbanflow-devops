<VirtualHost *:81>
    ServerName kanbanflow.local
    DocumentRoot /var/www/html

    <Directory /var/www/html>
        Options -Indexes +FollowSymLinks
        AllowOverride All
        Require all granted
        DirectoryIndex index.php index.html
    </Directory>

    # Não expõe arquivos sensíveis caso algum entre na imagem
    <FilesMatch "\.(env|sql|md)$">
        Require all denied
    </FilesMatch>

    ErrorLog /dev/stderr
    CustomLog /dev/stdout combined
</VirtualHost>