name: CI

on:
  push:
    branches: [dev, "feature/**"]
  pull_request:
    branches: [dev, main]

jobs:
  lint:
    name: Análise estática do PHP
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Instalar PHP 8.4
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.4"
          extensions: pdo, pdo_mysql
          tools: none

      - name: Verificar sintaxe de todos os arquivos PHP
        run: |
          erros=0
          while IFS= read -r arquivo; do
            php -l "$arquivo" || erros=1
          done < <(find src -name '*.php')
          exit $erros

      - name: Validar docker-compose.yml
        run: |
          cp .env.example .env
          docker compose config --quiet

  build-and-smoke-test:
    name: Build da imagem e testes de fumaça
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4

      - name: Preparar variáveis de ambiente
        run: cp .env.example .env

      - name: Construir e subir os containers
        run: docker compose up -d --build

      - name: Aguardar a aplicação ficar saudável
        run: |
          for tentativa in $(seq 1 30); do
            if curl -fsS http://localhost:8080/api/health.php > /dev/null; then
              echo "Aplicação respondeu na tentativa $tentativa."
              exit 0
            fi
            sleep 4
          done
          echo "A aplicação não respondeu no tempo esperado."
          docker compose logs
          exit 1

      - name: Teste de fumaça — ciclo CRUD completo
        run: |
          set -e
          echo "→ CREATE"
          id=$(curl -fsS -X POST http://localhost:8080/api/tasks.php \
                -H 'Content-Type: application/json' \
                -d '{"title":"Tarefa criada pela pipeline","priority":"alta"}' \
                | grep -o '"id": *[0-9]*' | head -1 | tr -dc '0-9')
          echo "id criado: $id"

          echo "→ READ"
          curl -fsS "http://localhost:8080/api/tasks.php?id=$id" | grep -q "pipeline"

          echo "→ UPDATE"
          curl -fsS -X PUT "http://localhost:8080/api/tasks.php?id=$id" \
            -H 'Content-Type: application/json' \
            -d '{"status":"done"}' | grep -q '"status": "done"'

          echo "→ DELETE"
          curl -fsS -X DELETE "http://localhost:8080/api/tasks.php?id=$id" | grep -q "excluída"

          echo "→ Validação: registro removido deve retornar 404"
          codigo=$(curl -s -o /dev/null -w '%{http_code}' "http://localhost:8080/api/tasks.php?id=$id")
          test "$codigo" = "404"

          echo "Todos os testes de fumaça passaram."

      - name: Validar que o frontend é servido pelo Apache
        run: curl -fsS http://localhost:8080/ | grep -q "KanbanFlow"

      - name: Logs em caso de falha
        if: failure()
        run: docker compose logs --tail 200

      - name: Derrubar o ambiente
        if: always()
        run: docker compose down -v
