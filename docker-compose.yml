name: kanbanflow

services:
  db:
    image: mariadb:11.4
    container_name: kanban_db
    restart: unless-stopped
    environment:
      MARIADB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
      MARIADB_DATABASE: ${DB_NAME}
      MARIADB_USER: ${DB_USER}
      MARIADB_PASSWORD: ${DB_PASSWORD}
    volumes:
      - db_data:/var/lib/mysql
      - ./db/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    networks:
      - kanban_net

  app:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    image: kanbanflow-app:local
    container_name: kanban_app
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DB_HOST: ${DB_HOST}
      DB_PORT: ${DB_PORT}
      DB_NAME: ${DB_NAME}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      APP_ENV: ${APP_ENV}
      APP_VERSION: ${APP_VERSION}
    ports:
      - "${APP_PORT}:81"
    volumes:
      - ./src:/var/www/html # hot reload em desenvolvimento
    networks:
      - kanban_net

volumes:
  db_data:

networks:
  kanban_net:
    driver: bridge
